# Local demo. Use the production example for environment-backed API keys.
server:
  port: 8080
  admin_address: 127.0.0.1:9090
  read_timeout: 5s
  read_header_timeout: 3s
  write_timeout: 10s
  idle_timeout: 1m
  shutdown_timeout: 5s

discovery:
  provider: mock
  watch_interval: 10s

middleware:
  global_enabled: [logging, auth, ratelimit]
  ratelimit:
    enabled: true
    requests_per_second: 100
    burst: 20
  auth:
    enabled: true
    api_key_header: X-API-Key
    demo_credentials: true
    internal_signing_key: local-demo-only-not-a-production-key
